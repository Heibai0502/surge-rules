name: Build domestic direct rules only

on:
  workflow_dispatch:
  schedule:
    # Beijing 06:30, matching the upstream schedule.
    - cron: '30 22 * * *'
  push:
    branches: [master]
    paths: ['scripts/**', '.github/workflows/run.yml']

permissions:
  contents: write

concurrency:
  group: direct-rules-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and validate the direct dataset
        run: python3 scripts/build_rules.py
      - name: Publish only the validated dataset
        run: |
          publish_dir=$(mktemp -d)
          git worktree add --detach "$publish_dir" HEAD
          git -C "$publish_dir" switch --orphan direct-rules-release
          cp generated/direct.list generated/direct.json generated/direct.domains generated/direct.ipcidr generated/manifest.json LICENSE "$publish_dir/"
          git -C "$publish_dir" config user.name github-actions[bot]
          git -C "$publish_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$publish_dir" add direct.list direct.json direct.domains direct.ipcidr manifest.json LICENSE
          git -C "$publish_dir" commit -m "Publish domestic and local DIRECT dataset"
          git -C "$publish_dir" push origin HEAD:release --force
